 function saveRoom(index){if(!allowEdit())return;const name=byId('roomName').value.trim();if(!name){toast('Enter a room name.',true);return;}if(['__proto__','constructor','prototype'].includes(name)){toast('Please use a different room name.',true);return;}const old=claim().rooms[index];if(claim().rooms.some(r=>lower(r)===lower(name)&&r!==old)){toast('That room already exists. Choose another name.',true);return;}const d={};for(const k of ['length','width','height']){const v=byId('room-'+k).value;if(v!==''&&(!Number.isFinite(Number(v))||Number(v)<0)){toast('Dimensions must be positive numbers.',true);return;}d[k]=v;}checkpoint();if(index<0)claim().rooms.push(name);else{claim().rooms[index]=name;claim().schedule.forEach(i=>{if(i.room===old)i.room=name;});delete claim().roomDimensions[old];}claim().roomDimensions[name]=d;room=name;rateRoom=name;changed();addActivity(index<0?'Room added':'Room updated');close();render();toast('Room saved.');}
