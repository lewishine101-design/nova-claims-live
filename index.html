 const claimAdminFields=['claimRef','claimantName','propertyAddress','claimType','assignedContractor','tbrnClaimsConcierge','tbrnReviewerSurveyor','assignedContractorEmail','assignedContractorEmailLower','assignedContractorName','contractorEmail','contractorEmailLower','contractorEmails','assignedToEmail','assignedTo','assignedEmail','assignedByEmail','assignedBy','assignedAt'];
 const claimAdminFormFields=['claimRef','claimantName','propertyAddress','claimType','assignedContractor','tbrnClaimsConcierge','tbrnReviewerSurveyor'];
 function conciergeProtected(p){const n=normalise(p);return {...scheduleVersionContent(n),cpp:n.cpp,regionalVariancePreset:n.regionalVariancePreset||'',scheduleHistory:n.scheduleHistory||[],scheduleVersion:n.scheduleVersion||null,scheduleCopyCode:n.scheduleCopyCode||'',scheduleCopyCodeCreatedAt:n.scheduleCopyCodeCreatedAt||''};}
 function validateConciergeSave(p,existing){
  if(!staffReady())throw new Error('Staff permissions must be confirmed before saving.');
  if(staffLevel()!=='concierge')return;
  if(!equal(conciergeProtected(p),conciergeProtected(existing||newPayload())))throw new Error('Claims Concierges cannot change repair schedules, pricing, plans or saved versions. Open the latest live claim.');
  const from=existing?cleanStatus(existing.scheduleStatus||existing.formData?.scheduleStatus):'Draft';
  if(p.scheduleStatus!==from&&!(from==='Draft'&&p.scheduleStatus==='Assigned To Contractor'))throw new Error('Schedule status changes require Surveyor / Reviewer or Admin / Management access.');
 }
 function conciergeWrite(p,existing){
  const data={},form={...(existing?.formData||{})};
  for(const key of claimAdminFields)if(p[key]!==undefined)data[key]=clone(p[key]);
  for(const key of claimAdminFormFields)form[key]=p[key]??'';
  for(const key of ['claimRef','claimantName','propertyAddress','assignedContractor'])data[key+'Lower']=lower(p[key]);
  data.formData=form;
  const from=existing?cleanStatus(existing.scheduleStatus||existing.formData?.scheduleStatus):null;

  if(!existing)data.schedule=[];
